<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - Splash and Paint</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      color: #333;
      min-height: 100vh;
    }
    
    header {
      background: url('Steel-and-Petals.jpg') center/cover no-repeat;
      padding: 4rem 2rem;
      text-align: center;
      color: white;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      min-height: 300px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    
    header h1 {
      font-size: 2.5rem;
      margin: 0;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }
    
    header p {
      font-size: 1.2rem;
      margin: 0.5rem 0 0 0;
      opacity: 0.9;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }
    
    nav {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 1rem;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    nav a {
      margin: 0 1.5rem;
      text-decoration: none;
      color: #444;
      font-weight: 600;
      padding: 0.5rem 1rem;
      border-radius: 25px;
      transition: all 0.3s ease;
    }
    
    nav a:hover, nav a.active {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    
    main {
      padding: 3rem 2rem;
      max-width: 1000px;
      margin: 0 auto;
    }
    
    .contact-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      margin-bottom: 3rem;
    }
    
    .contact-form, .contact-info {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 2.5rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      position: relative;
    }
    
    .contact-form::before, .contact-info::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 20px 20px 0 0;
    }
    
    .contact-form h2, .contact-info h2 {
      color: #667eea;
      margin-bottom: 1.5rem;
      font-size: 1.8rem;
    }
    
    .form-group {
      margin-bottom: 1.5rem;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #333;
    }
    
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.8rem;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1rem;
      transition: border-color 0.3s ease;
      box-sizing: border-box;
    }
    
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .form-group textarea {
      resize: vertical;
      min-height: 120px;
    }
    
    .submit-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 1rem 2rem;
      border: none;
      border-radius: 25px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }
    
    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
    }
    
    .contact-item {
      display: flex;
      align-items: center;
      margin-bottom: 1.5rem;
      padding: 1rem;
      background: rgba(102, 126, 234, 0.1);
      border-radius: 15px;
      transition: transform 0.3s ease;
    }
    
    .contact-item:hover {
      transform: translateX(5px);
    }
    
    .contact-icon {
      font-size: 1.5rem;
      margin-right: 1rem;
      color: #667eea;
      width: 30px;
      text-align: center;
    }
    
    .contact-details h3 {
      margin: 0 0 0.3rem 0;
      color: #333;
      font-size: 1.1rem;
    }
    
    .contact-details p {
      margin: 0;
      color: #666;
    }
    
    .contact-details a {
      color: #667eea;
      text-decoration: none;
      transition: color 0.3s ease;
    }
    
    .contact-details a:hover {
      color: #764ba2;
      text-decoration: underline;
    }
    
    .commission-info {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 2.5rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      margin-top: 2rem;
      position: relative;
    }
    
    .commission-info::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 20px 20px 0 0;
    }
    
    .commission-info h2 {
      color: #667eea;
      margin-bottom: 1rem;
    }
    
    .commission-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-top: 1.5rem;
    }
    
    .commission-card {
      background: rgba(102, 126, 234, 0.1);
      padding: 1.5rem;
      border-radius: 15px;
      text-align: center;
      transition: transform 0.3s ease;
    }
    
    .commission-card:hover {
      transform: translateY(-5px);
    }
    
    .commission-card h3 {
      color: #667eea;
      margin-bottom: 0.5rem;
    }
    
    .commission-card .price {
      font-size: 1.2rem;
      font-weight: bold;
      color: #333;
      margin-bottom: 0.5rem;
    }
    
    .commission-card .size {
      color: #666;
      font-size: 0.9rem;
    }
    
    footer {
      text-align: center;
      padding: 2rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      margin-top: 3rem;
    }
    
    .success-message {
      background: linear-gradient(135deg, #27ae60, #2ecc71);
      color: white;
      padding: 1rem;
      border-radius: 10px;
      margin-bottom: 1rem;
      display: none;
    }
    
    @media (max-width: 768px) {
      .contact-container {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
      
      .commission-grid {
        grid-template-columns: 1fr;
      }
      
      main {
        padding: 2rem 1rem;
      }
      
      .contact-form, .contact-info, .commission-info {
        padding: 2rem;
      }
      
      header h1 {
        font-size: 2rem;
      }
      
      nav a {
        margin: 0 0.5rem;
        font-size: 0.9rem;
      }
    }
